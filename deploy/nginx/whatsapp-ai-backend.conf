server {
    listen 80;
    server_name whatsapp-api.jacobsfamjam.dpdns.org;

    location / {
        # WhatsApp AI backend on vpn_net
        proxy_pass http://10.10.200.31:8081;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Disable buffering for real-time responses
        proxy_buffering off;
        proxy_cache off;

        # Long timeouts for LLM processing
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_connect_timeout 10s;
    }

    # Health check endpoint
    location /actuator/health {
        proxy_pass http://10.10.200.31:8081/actuator/health;
        proxy_set_header Host $host;
        access_log off; # Don't log health checks
    }

    # Webhook endpoint (internal use - consider restricting)
    location /webhook {
        proxy_pass http://10.10.200.31:8081/webhook;
        proxy_set_header Host $host;

        # Only allow from internal network
        allow 10.10.200.0/24;
        allow 172.17.0.0/16;
        deny all;
    }
}
