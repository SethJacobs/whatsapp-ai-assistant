server {
    listen 80;
    server_name whatsapp.jacobsfamjam.dpdns.org;

    location / {
        # WhatsApp bridge on vpn_net
        proxy_pass http://10.10.200.30:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for real-time updates
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard timeouts
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # QR code endpoint - frequently accessed during setup
    location /bridge/qr {
        proxy_pass http://10.10.200.30:3000/bridge/qr;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    # Health check endpoint
    location /bridge/health {
        proxy_pass http://10.10.200.30:3000/bridge/health;
        proxy_set_header Host $host;
        access_log off; # Don't log health checks
    }
}
