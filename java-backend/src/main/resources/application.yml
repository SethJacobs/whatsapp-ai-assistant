spring:
  application:
    name: whatsapp-ai

  datasource:
    url: jdbc:sqlite:${DB_PATH:./data/whatsapp-ai.db}
    driver-class-name: org.sqlite.JDBC

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:8081}

# Gateway configuration
gateway:
  base-url: ${GATEWAY_BASE_URL:http://ai-gateway.local}
  timeout-seconds: 600  # 10 minutes - prefer waiting over timeout errors

# WhatsApp Bridge configuration
bridge:
  base-url: ${BRIDGE_BASE_URL:http://localhost:3000}

# Home Assistant configuration
homeassistant:
  url: ${HOMEASSISTANT_URL:https://ha.jacobsfamjam.dpdns.org}
  token: ${HOMEASSISTANT_TOKEN}

# Security configuration
security:
  # Comma-separated list of admin phone numbers
  admin-phone: ${ADMIN_PHONE:}
  additional-admin-phones: ${ADDITIONAL_ADMIN_PHONES:}

# Tool execution configuration
tools:
  execution-timeout-seconds: 300

# Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      gateway:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        minimum-number-of-calls: 5

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    root: INFO
    com.jacobsfam.whatsappai: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
